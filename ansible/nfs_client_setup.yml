---
- name: Configure NFS client
  hosts: all
  become: true
  gather_facts: false
  vars:
    # NFS client configuration
    nfs_mount_src: 192.168.122.130:/export
    nfs_mount_dir: /mnt/remote

    # NFS client implementation
    packages_install:
      - nfs-utils
    files_create:
      - state: directory
        path: "{{ nfs_mount_dir }}"
        owner: nobody
        group: nobody
        mode: '0755'
    service_state_enable:
      - nfs-client.target
    mount_setup_enable:
      - src: "{{ nfs_mount_src }}"
        path: "{{ nfs_mount_dir }}"
        fstype: nfs
        opts: _netdev,hard
        state: mounted

  roles:
    - role: packages_install
      tags: ["packages_install"]
    - role: files_create
      tags: ["files_create"]
    - role: service_state
      tags: ["service_state"]
    - role: mount_setup
      tags: ["mount_setup"]
