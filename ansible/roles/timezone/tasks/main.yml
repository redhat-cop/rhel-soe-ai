---
- name: List timezones available on this system
  ansible.builtin.command: timedatectl list-timezones
  register: soe_timezone_available
  changed_when: false
  check_mode: false
  tags: [timezone]

- name: Assert the requested timezone is a valid IANA zone
  ansible.builtin.assert:
    that: soe_timezone in soe_timezone_available.stdout_lines
    fail_msg: "'{{ soe_timezone }}' is not a valid IANA timezone per timedatectl list-timezones."
  tags: [timezone]

- name: Get current timezone
  ansible.builtin.command: timedatectl show --property=Timezone --value
  register: soe_timezone_current
  changed_when: false
  check_mode: false
  tags: [timezone]

- name: Set system timezone
  ansible.builtin.command: timedatectl set-timezone {{ soe_timezone }}
  when: soe_timezone_current.stdout != soe_timezone
  changed_when: true
  tags: [timezone]
