---
# /etc/login.defs is only read by useradd at account-creation time, so this
# only sets the aging policy new accounts are created with — it does not
# retroactively change PASS_MAX_DAYS/PASS_MIN_DAYS/PASS_WARN_AGE for
# existing accounts (those live in /etc/shadow per-user and need `chage`,
# which is a per-account judgment call this role doesn't make).
- name: Enforce password aging defaults in /etc/login.defs
  ansible.builtin.lineinfile:
    path: /etc/login.defs
    regexp: "^{{ item.key }}\\s"
    line: "{{ item.key }}\t{{ item.value }}"
    create: true
    mode: "0644"
  loop:
    - { key: PASS_MAX_DAYS, value: "{{ soe_accounts_pass_max_days }}" }
    - { key: PASS_MIN_DAYS, value: "{{ soe_accounts_pass_min_days }}" }
    - { key: PASS_WARN_AGE, value: "{{ soe_accounts_pass_warn_age }}" }
  tags: [accounts_policy]

- name: Enforce password quality settings
  ansible.builtin.lineinfile:
    path: /etc/security/pwquality.conf
    regexp: "^#?{{ item.key }}\\s*="
    line: "{{ item.key }} = {{ item.value }}"
    create: true
    mode: "0644"
  loop: "{{ soe_accounts_pwquality | dict2items }}"
  tags: [accounts_policy]

- name: Find accounts with empty passwords
  ansible.builtin.command: "awk -F: '($2==\"\"){print $1}' /etc/shadow"
  register: soe_accounts_empty_passwords
  changed_when: false
  check_mode: false
  tags: [accounts_policy]

- name: Assert no accounts have empty passwords
  ansible.builtin.assert:
    that: soe_accounts_empty_passwords.stdout == ""
    fail_msg: "Accounts with empty passwords: {{ soe_accounts_empty_passwords.stdout_lines }} — lock them (usermod -L), don't delete without confirmation."
  tags: [accounts_policy]

- name: Find duplicate UIDs
  ansible.builtin.shell:
    cmd: "set -o pipefail && awk -F: '{print $3}' /etc/passwd | sort | uniq -d"
    executable: /bin/bash
  register: soe_accounts_dup_uids
  changed_when: false
  check_mode: false
  tags: [accounts_policy]

- name: Assert no duplicate UIDs
  ansible.builtin.assert:
    that: soe_accounts_dup_uids.stdout == ""
    fail_msg: "Duplicate UIDs found: {{ soe_accounts_dup_uids.stdout_lines }}"
  tags: [accounts_policy]

- name: Find sudoers files with incorrect permissions
  ansible.builtin.command: find {{ soe_accounts_sudoers_paths | join(' ') }} -type f ! -perm 0440
  register: soe_accounts_bad_sudoers_perms
  changed_when: false
  check_mode: false
  tags: [accounts_policy]

- name: Assert sudoers file permissions are 0440
  ansible.builtin.assert:
    that: soe_accounts_bad_sudoers_perms.stdout == ""
    fail_msg: "sudoers files with wrong permissions: {{ soe_accounts_bad_sudoers_perms.stdout_lines }}"
  tags: [accounts_policy]

- name: Find NOPASSWD:ALL entries in sudoers
  ansible.builtin.shell: grep -rn 'NOPASSWD:ALL' {{ soe_accounts_sudoers_paths | join(' ') }} || true
  register: soe_accounts_nopasswd_all
  changed_when: false
  check_mode: false
  tags: [accounts_policy]

- name: Report NOPASSWD:ALL sudoers entries for manual review
  ansible.builtin.debug:
    msg: "NOPASSWD:ALL entries found (review, not auto-removed): {{ soe_accounts_nopasswd_all.stdout_lines }}"
  when: soe_accounts_nopasswd_all.stdout != ""
  tags: [accounts_policy]
