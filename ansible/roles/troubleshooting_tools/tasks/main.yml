---
- name: Gather installed package facts
  ansible.builtin.package_facts:
    manager: auto
  tags: [troubleshooting_tools]

- name: Determine missing baseline troubleshooting packages
  ansible.builtin.set_fact:
    soe_troubleshooting_missing: "{{ soe_troubleshooting_packages | difference(ansible_facts.packages.keys() | list) }}"
  tags: [troubleshooting_tools]

- name: Report baseline troubleshooting tool compliance
  ansible.builtin.debug:
    msg: >-
      {{ 'All baseline troubleshooting packages are present: ' ~ (soe_troubleshooting_packages | join(', '))
         if (soe_troubleshooting_missing | length == 0)
         else 'Missing baseline troubleshooting packages: ' ~ (soe_troubleshooting_missing | join(', ')) }}
  tags: [troubleshooting_tools]

- name: Ensure baseline troubleshooting packages are installed
  ansible.builtin.package:
    name: "{{ soe_troubleshooting_packages }}"
    state: present
  tags: [troubleshooting_tools]
