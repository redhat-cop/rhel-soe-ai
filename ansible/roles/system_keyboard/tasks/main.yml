---
# localectl has no "show"/--property machine-readable output (unlike
# timedatectl/systemctl) — status is the only read path, so parse it.
- name: Get current keyboard status
  ansible.builtin.command: localectl status
  register: soe_keyboard_status
  changed_when: false
  check_mode: false
  tags: [system_keyboard]

- name: Set console keymap
  ansible.builtin.command: localectl set-keymap {{ soe_keyboard_vc_keymap }}
  when: "('VC Keymap: ' + soe_keyboard_vc_keymap) not in soe_keyboard_status.stdout"
  changed_when: true
  tags: [system_keyboard]

- name: Set X11 keyboard layout
  ansible.builtin.command: localectl set-x11-keymap {{ soe_keyboard_x11_layout }}
  when:
    - soe_keyboard_manage_x11
    - "('X11 Layout: ' + soe_keyboard_x11_layout) not in soe_keyboard_status.stdout"
  changed_when: true
  tags: [system_keyboard]
