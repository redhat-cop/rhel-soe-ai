---
- name: Deploy approved /etc/motd
  ansible.builtin.copy:
    dest: /etc/motd
    content: "{{ soe_motd_content }}"
    owner: root
    group: root
    mode: "0644"
  tags: [motd_issue]

- name: Deploy approved /etc/issue
  ansible.builtin.copy:
    dest: /etc/issue
    content: "{{ soe_issue_content }}"
    owner: root
    group: root
    mode: "0644"
  tags: [motd_issue]

- name: Deploy approved /etc/issue.net
  ansible.builtin.copy:
    dest: /etc/issue.net
    content: "{{ soe_issue_content }}"
    owner: root
    group: root
    mode: "0644"
  tags: [motd_issue]

- name: Ensure sshd presents the pre-auth banner
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?Banner"
    line: "Banner {{ soe_sshd_banner_path }}"
    validate: /usr/sbin/sshd -t -f %s
  notify: Reload sshd
  when: soe_sshd_manage_banner
  tags: [motd_issue]
