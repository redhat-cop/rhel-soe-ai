---
- name: Apply the Linux Standard Operating Environment baseline
  hosts: all
  become: true
  # NB: system_init, system_reboot, system_unregister, and system_update are
  # deliberately NOT in this list -- each acts unconditionally (no guard
  # variable defaulting to a no-op) and/or reboots, auto-updates, or
  # de-registers the host outright. Run them individually with
  # `--tags <name>` when that specific action is actually wanted; see each
  # role's .claude/skills/<name>/SKILL.md.
  roles:
    - accounts_local
    - accounts_policy
    - audit_setup
    - boot_parameters
    - certificates
    - cron_setup
    - dns_cache
    - domain_ad
    - etc_hosts
    - files_acl
    - files_copy
    - files_create
    - files_fetch
    - files_get
    - files_properties
    - files_remove
    - files_unarchive
    - firewall
    - guest_agent
    - ima_evm_setup
    - ipv6_setup
    - motd_issue
    - mount_setup
    - multipath_setup
    - packages_install
    - packages_remove
    - packages_verify
    - performance_tuning
    - repository_setup
    - rescue_image
    - resolver_configuration
    - root_password
    - scap_compliance
    - scap_satellite
    - sebooleans
    - security_hardening
    - service_state
    - shell_profile
    - splunk_forwarder
    - sshd_configuration
    - system_coredump
    - system_hostname
    - system_keyboard
    - system_locale
    - timesync
    - timezone
    - troubleshooting_tools
    - usbguard_setup
    - watchdog
